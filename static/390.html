<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Control Page</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='/css/control.css'>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src='/js/390.js'></script>
    <script src='/js/qrcode.min.js'></script>
</head>

<body>
    <div>
        <h2>Display Control</h2>
        <button onclick="showGame()">Show Game</button>
        <br/><br/>
        <button onclick="showPost()">Show Postgame</button>
    </div>
    <br/><br/>
    <div style="display:flex; flex-direction: column; row-gap: .25em; width:fit-content">
        <h2>Score Input</h2>
        <label>Match <input id="match" type="number"/></label>
        <label>Team <input id="team" type="number"/></label>
        <label>Points <input id="score" type="number"/></label>
        <label>Penalties <input id="penalties" type="number"/></label>
        <label>Duckies <input id="duckies" type="number"/></label>
        <label>Reputation <input id="karma" type="number"/></label>
        <button onclick="saveScore()">Submit</button>
    </div>

    <iframe id="preview" src="/autopage"></iframe>
</body>

</html>
